name: Framework Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install framework
        run: python -m pip install -e .
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Validate blank templates
        run: python tools/validate_blank_templates.py
      - name: Validate artifact manifest completeness
        run: python tools/validate_artifact_manifest.py

  public-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Use scanner from main (a PR cannot grade its own diff with a weakened copy)
        run: |
          if git cat-file -e origin/main:tools/public_safety_scan.py 2>/dev/null; then
            git show origin/main:tools/public_safety_scan.py > tools/public_safety_scan.py
          fi
      - name: Run public-safety scan
        env:
          PUBLIC_SAFETY_COMMIT_RANGE_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: python tools/public_safety_scan.py

  change-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Use ledger checker from main (a PR cannot grade its own diff with a weakened copy)
        run: |
          if git cat-file -e origin/main:tools/validate_change_ledger.py 2>/dev/null; then
            git show origin/main:tools/validate_change_ledger.py > tools/validate_change_ledger.py
          fi
      - name: Validate change ledger
        run: python tools/validate_change_ledger.py
