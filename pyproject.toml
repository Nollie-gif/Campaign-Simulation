[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campaign-simulation"
version = "0.2.0"
description = "Campaign-neutral Prequel and Sequel simulation framework"
requires-python = ">=3.11"

[project.scripts]
campaign-simulation = "campaign_simulation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
